# .github/workflows/ami_build.yml

name: "Packer AMI 만들고 그걸로 ec2만들기"
on:
  push:
    branches:
      - master # master 브랜치의 push이면서
    paths:
      - "packer/**" # packer/ 하위 경로에 변화가 있을 때 동작한다
    workingflow_dispatch # 원할때 deploy 할 수 있는 옵선
jobs:
  packer_build:
    runs-on: ubuntu-latest

    name: "build AMI with packer & ansible"
    steps:
      - name: checkout repository # github 저장소로부터 소스코드 가져오기
        uses: actions/checkout@v5

      - name: Setup Packer # packer 설치
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      # 인증정보를 환경변수에 넣을 수도 있지만 혹시 중간에 에러가 났을때 인증키가 로그에 노출될수있다
      - name: AWS Configure # AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Packer init, build # 초기화와 빌드
        run: |
          packer init .
          packer build .
        working-directory: ./packer

      - name: Setup terraform # 테라폼 환경 구성
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init, apply # 테라폼 자원을 init
        run: |
          terraform init
          terraform apply --auto-approve
        working-directory: ./terraform
